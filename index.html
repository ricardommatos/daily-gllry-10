<style>
:root{--accent:#ff4d00;--bg:#292929;--text:#111;--text-muted:#888;--border:rgba(0,0,0,.06);--border-strong:rgba(0,0,0,.15);--hover:rgba(0,0,0,.06);--dot:rgba(0,0,0,.15);--dot-hover:rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;text-transform:uppercase;font-size:12px;letter-spacing:.05em;overflow-x:hidden}
.fixed-circle{position:fixed;width:55vw;height:55vw;max-width:700px;max-height:700px;border-radius:50%;background:var(--accent);top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;opacity:.92}
.header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border)}
.header-left{font-weight:700;font-size:13px;letter-spacing:.1em}
.tag{color:var(--text-muted);font-size:11px}
.toolbar{display:flex;justify-content:center;padding:16px 32px;gap:12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:61px;z-index:99}
button{font-family:'Roboto Mono',monospace;text-transform:uppercase;font-size:11px;letter-spacing:.08em;cursor:pointer;border:none;background:none;color:var(--text);padding:8px 14px;border-radius:4px;transition:all .15s}
button:hover{background:var(--hover)}
button.active{background:var(--text);color:var(--bg)}
.masonry{position:relative;z-index:1;padding:44px;columns:3;column-gap:44px}
.masonry-item{break-inside:avoid;margin-bottom:44px;cursor:pointer;transition:transform .2s}
.masonry-item:hover{transform:scale(1.015)}
.masonry-item img{width:100%;display:block}
@media(max-width:1100px){.masonry{columns:3}}
@media(max-width:750px){.masonry{columns:2}}
@media(max-width:450px){.masonry{columns:1;padding:16px 12px}}
.lightbox{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column}
.lightbox.open{display:flex}
.lightbox-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--border)}
.lightbox-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:40px;overflow:hidden}
.lightbox-img-wrap{position:relative;max-width:75vw;max-height:75vh;display:flex;align-items:center;justify-content:center}
.lightbox-img-wrap img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:4px;position:relative;z-index:2}
.lightbox-circle{position:absolute;width:85%;aspect-ratio:1;border-radius:50%;background:var(--accent);z-index:1;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.92}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:24px;color:var(--text-muted);cursor:pointer;padding:16px;user-select:none;z-index:10;background:none;border:none;font-family:'Roboto Mono',monospace}
.lightbox-nav:hover{color:var(--text);background:none}
.lightbox-nav.prev{left:24px}.lightbox-nav.next{right:24px}
.lightbox-dots{display:flex;justify-content:center;gap:8px;padding:24px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);cursor:pointer;transition:all .2s;border:none;padding:0}
.dot:hover{background:var(--dot-hover)}.dot.active{background:var(--accent)}
.lightbox-counter{color:var(--text-muted);font-size:11px}
.gyro{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow:hidden}
.gyro.open{display:block}
.gyro canvas{position:absolute;inset:0;width:100%;height:100%}
.gyro-header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 32px;z-index:50;pointer-events:none}
.gyro-header>*{pointer-events:auto}
.gyro-preview{position:absolute;bottom:32px;left:32px;z-index:50;display:flex;flex-direction:column;gap:8px}
.gyro-preview img{width:120px;height:80px;object-fit:cover;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.15);transition:opacity .2s}
.gyro-preview span{font-size:10px;color:var(--text-muted)}
.gyro-hint{position:absolute;bottom:32px;right:32px;z-index:50;font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.gyro-hint .dot-pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s ease infinite}
.gyro-lightbox{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,0);display:flex;justify-content:center;align-items:center;cursor:pointer;pointer-events:none;transition:background .4s ease;perspective:900px}
.gyro-lightbox.open{pointer-events:auto;background:rgba(0,0,0,.85)}
.gyro-lightbox img{max-width:85vw;max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.4);opacity:0;transform:rotateX(8deg) rotateY(-4deg) scale(.85) translateZ(-60px);transition:opacity .45s ease,transform .45s cubic-bezier(.25,.46,.45,.94)}
.gyro-lightbox.open img{opacity:1;transform:rotateX(0) rotateY(0) scale(1) translateZ(0)}
.gyro-lightbox-close{position:absolute;top:24px;right:32px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:8px 16px;border-radius:20px;cursor:pointer;opacity:0;transform:translateY(-8px);transition:background .2s,opacity .35s ease .15s,transform .35s ease .15s}
.gyro-lightbox.open .gyro-lightbox-close{opacity:1;transform:translateY(0)}
.gyro-lightbox-close:hover{background:rgba(255,255,255,.25)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<div class="fixed-circle"></div>
<header class="header"><div class="header-left">DAILY GLLRY #10</div><div style="display:flex;gap:16px"><span class="tag">APR 15 26</span><span class="tag">#CT-DESIGN</span></div></header>
<div class="toolbar">

</div>

<div class="lightbox-body"><button class="lightbox-nav prev" onclick="navImage(-1)">&lt;</button><div class="lightbox-img-wrap"><div class="lightbox-circle"></div><img id="lightbox-img" src="" alt=""></div><button class="lightbox-nav next" onclick="navImage(1)">&gt;</button></div>

<script>
const imagePaths=["images/img-001.jpg","images/img-002.png","images/img-003.jpg","images/img-004.jpg","images/img-005.jpg","images/img-006.jpg","images/img-007.jpg","images/img-008.jpg","images/img-009.jpg","images/img-010.jpg","images/img-011.jpg","images/img-012.jpg","images/img-013.jpg","images/img-014.jpg","images/img-015.jpg","images/img-016.jpg","images/img-017.jpg","images/img-018.jpg","images/img-019.jpg","images/img-020.gif","images/img-021.jpg","images/img-022.jpg","images/img-023.jpg","images/img-024.jpg","images/img-025.jpg","images/img-026.jpg","images/img-027.jpg","images/img-028.jpg","images/img-029.jpg","images/img-030.jpg","images/img-031.jpg","images/img-032.jpg","images/img-033.jpg","images/img-034.jpg","images/img-035.jpg","images/img-036.jpg","images/img-037.jpg","images/img-038.jpg","images/img-039.jpg","images/img-040.jpg","images/img-041.jpg","images/img-042.jpg","images/img-043.jpg","images/img-044.jpg","images/img-045.jpg","images/img-046.jpg","images/img-047.jpg","images/img-048.jpg","images/img-049.jpg","images/img-050.jpg","images/img-051.jpg","images/img-052.jpg","images/img-053.jpg","images/img-054.jpg","images/img-055.jpg","images/img-056.jpg","images/img-057.jpg","images/img-058.jpg","images/img-059.jpg","images/img-060.jpg","images/img-061.jpg","images/img-062.jpg","images/img-063.jpg","images/img-064.jpg","images/img-065.jpg","images/img-066.jpg","images/img-067.jpg","images/img-068.jpg","images/img-069.jpg","images/img-070.jpg","images/img-071.jpg","images/img-072.jpg","images/img-073.jpg","images/img-074.jpg","images/img-075.jpg","images/img-076.jpg","images/img-077.jpg","images/img-078.jpg","images/img-079.jpg","images/img-080.jpg","images/img-081.jpg","images/img-082.jpg","images/img-083.gif","images/img-084.jpg","images/img-085.jpg","images/img-086.jpg","images/img-087.jpg","images/img-088.jpg","images/img-089.jpg","images/img-090.jpg","images/img-091.jpg","images/img-092.jpg","images/img-093.jpg","images/img-094.gif","images/img-095.jpg","images/img-096.png","images/img-097.jpg","images/img-098.png","images/img-099.jpg","images/img-100.jpg","images/img-101.gif","images/img-102.png","images/img-103.jpg","images/img-104.jpg","images/img-105.jpg","images/img-106.jpg","images/img-107.jpg","images/img-108.jpg","images/img-109.jpg","images/img-110.jpg","images/img-111.gif","images/img-112.jpg","images/img-113.png","images/img-114.png","images/img-115.jpg","images/img-116.jpg","images/img-117.jpg","images/img-118.jpg","images/img-119.jpg","images/img-120.jpg","images/img-121.jpg","images/img-122.jpg","images/img-123.jpg","images/img-124.jpg","images/img-125.jpg","images/img-126.jpg","images/img-127.jpg","images/img-128.jpg","images/img-129.jpg","images/img-130.jpg","images/img-131.jpg","images/img-132.jpg","images/img-133.png","images/img-134.png","images/img-135.jpg","images/img-136.jpg","images/img-137.jpg","images/img-138.jpg","images/img-139.jpg","images/img-140.jpg","images/img-141.jpg","images/img-142.jpg","images/img-143.jpg","images/img-144.jpg","images/img-145.jpg","images/img-146.jpg","images/img-147.jpg","images/img-148.jpg","images/img-149.jpg","images/img-150.jpg"];let currentIndex=0,currentView='grid';
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}
function getLuminance(h){const{r,g,b}=hexToRgb(h);return(.299*r+.587*g+.114*b)/255}
function updateUIColors(bg){const s=document.documentElement.style,d=getLuminance(bg)<.5;s.setProperty('--text',d?'#f0f0f0':'#111');s.setProperty('--text-muted',d?'#999':'#888');s.setProperty('--border',d?'rgba(255,255,255,.1)':'rgba(0,0,0,.06)');s.setProperty('--border-strong',d?'rgba(255,255,255,.2)':'rgba(0,0,0,.15)');s.setProperty('--hover',d?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)');s.setProperty('--dot',d?'rgba(255,255,255,.2)':'rgba(0,0,0,.15)');s.setProperty('--dot-hover',d?'rgba(255,255,255,.4)':'rgba(0,0,0,.3)')}
updateUIColors('#292929');
function renderGrid(){const m=document.getElementById('masonry');m.innerHTML='';imagePaths.forEach((src,i)=>{const item=document.createElement('div');item.className='masonry-item';item.onclick=()=>openLightbox(i);const el=document.createElement('img');el.src=src;el.alt='Image '+(i+1);item.appendChild(el);m.appendChild(item)})}
function setView(mode){currentView=mode;document.getElementById('btn-grid').classList.toggle('active',mode==='grid');document.getElementById('btn-single').classList.toggle('active',mode==='single');document.getElementById('btn-gyro').classList.toggle('active',mode==='gyro');if(mode==='grid'){closeLightbox();if(window.closeGyro)window.closeGyro()}else if(mode==='single'){if(window.closeGyro)window.closeGyro();if(imagePaths.length>0)openLightbox(0)}else if(mode==='gyro'){closeLightbox();if(window.openGyro)window.openGyro()}}
function openLightbox(i){currentIndex=i;currentView='single';document.getElementById('btn-grid').classList.remove('active');document.getElementById('btn-single').classList.add('active');document.getElementById('btn-gyro').classList.remove('active');document.getElementById('lightbox').classList.add('open');updateLightbox()}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
function updateLightbox(){document.getElementById('lightbox-img').src=imagePaths[currentIndex];document.getElementById('lightbox-counter').textContent=(currentIndex+1)+' / '+imagePaths.length;const d=document.getElementById('lightbox-dots');d.innerHTML='';imagePaths.forEach((_,i)=>{const dot=document.createElement('button');dot.className='dot'+(i===currentIndex?' active':'');dot.onclick=()=>{currentIndex=i;updateLightbox()};d.appendChild(dot)})}
function navImage(dir){currentIndex=(currentIndex+dir+imagePaths.length)%imagePaths.length;updateLightbox()}
document.addEventListener('keydown',e=>{if(currentView==='single'){if(e.key==='ArrowRight')navImage(1);if(e.key==='ArrowLeft')navImage(-1);if(e.key==='Escape')setView('grid')}if(currentView==='gyro'&&e.key==='Escape'){if(window.closeGyroLightbox&&document.getElementById('gyro-lightbox').classList.contains('open')){window.closeGyroLightbox()}else{setView('grid')}}});
renderGrid();

<script type="module">
import * as THREE from 'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';
let gScene,gCam,gRend,gCtrl,gMeshes=[],gTexs=[],gRAF=null,gAutoGrp,gScrollGrp,gRay,gMouse,gTMouse,gHov=null,gLBOpen=false,gClickStart={x:0,y:0};
const gR=8.5;
function gAnimate(t,p,to,dur){const s=t[p],st=performance.now();function step(n){const f=Math.min((n-st)/(dur*1000),1),e=1-Math.pow(1-f,3);t[p]=s+(to-s)*e;if(f<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function initGyro(){const c=document.getElementById('gyro-canvas');c.innerHTML='';const bgHex='#292929',bgC=new THREE.Color(bgHex);gScene=new THREE.Scene();gScene.background=bgC;gScene.fog=new THREE.Fog(bgC,15,35);gCam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);gCam.position.set(0,4,22);gRend=new THREE.WebGLRenderer({antialias:true});gRend.setSize(innerWidth,innerHeight);gRend.setPixelRatio(Math.min(devicePixelRatio,2));c.appendChild(gRend.domElement);gCtrl=new OrbitControls(gCam,gRend.domElement);gCtrl.enableZoom=false;gCtrl.enablePan=false;gCtrl.enableDamping=true;gCtrl.dampingFactor=.05;gScene.add(new THREE.AmbientLight(0xffffff,2));const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(5,10,10);gScene.add(dl);const pg=new THREE.Group();gScene.add(pg);pg.rotation.x=-.15;gScrollGrp=new THREE.Group();pg.add(gScrollGrp);gAutoGrp=new THREE.Group();gScrollGrp.add(gAutoGrp);const total=imagePaths.length,geo=new THREE.PlaneGeometry(2,1.4,1,1);gMeshes=[];gTexs=[];const mImgs=document.querySelectorAll('#masonry img');imagePaths.forEach((src,i)=>{const a=(i/total)*Math.PI*2;const tex=new THREE.Texture();tex.colorSpace=THREE.SRGBColorSpace;tex.generateMipmaps=true;tex.minFilter=THREE.LinearMipmapLinearFilter;if(mImgs[i]&&mImgs[i].complete&&mImgs[i].naturalWidth>0){tex.image=mImgs[i];tex.needsUpdate=true}else{const im=new Image();im.crossOrigin='anonymous';im.onload=function(){tex.image=im;tex.needsUpdate=true};im.src=src}gTexs.push(tex);const mat=new THREE.MeshStandardMaterial({color:0xffffff,map:tex,side:THREE.DoubleSide,roughness:.3,metalness:.2});const m=new THREE.Mesh(geo,mat);m.position.x=gR*Math.cos(a);m.position.z=gR*Math.sin(a);m.position.y=0;m.lookAt(0,0,0);m.rotateY(Math.PI/2);m.userData={index:i,angle:a,src};gAutoGrp.add(m);gMeshes.push(m)});gRay=new THREE.Raycaster();gMouse=new THREE.Vector2(-100,-100);gTMouse=new THREE.Vector2(0,0);gHov=null;document.getElementById('gyro-counter').textContent=total+' images';if(imagePaths.length>0){document.getElementById('gyro-preview-img').src=imagePaths[0];document.getElementById('gyro-preview-label').textContent='Image 1 / '+total}}
function gOnMM(e){gTMouse.x=(e.clientX/innerWidth)*2-1;gTMouse.y=-(e.clientY/innerHeight)*2+1}
function gOnWh(e){if(gLBOpen)return;gScrollGrp.rotation.y+=e.deltaY*.002}
function gOnMD(e){gClickStart.x=e.clientX;gClickStart.y=e.clientY}
function gOnCk(e){if(gLBOpen)return;const dx=e.clientX-gClickStart.x,dy=e.clientY-gClickStart.y;if(Math.sqrt(dx*dx+dy*dy)>5)return;const cm=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);gRay.setFromCamera(cm,gCam);const its=gRay.intersectObjects(gMeshes);if(its.length>0){const o=its[0].object;document.getElementById('gyro-lightbox-img').src=o.userData.src;document.getElementById('gyro-lightbox').classList.add('open');gLBOpen=true}}
window.closeGyroLightbox=function(){document.getElementById('gyro-lightbox').classList.remove('open');gLBOpen=false};
function gOnRs(){if(!gCam||!gRend)return;gCam.aspect=innerWidth/innerHeight;gCam.updateProjectionMatrix();gRend.setSize(innerWidth,innerHeight)}
function gLoop(){gCtrl.update();if(!gLBOpen){gMouse.x+=(gTMouse.x-gMouse.x)*.1;gMouse.y+=(gTMouse.y-gMouse.y)*.1;gAutoGrp.rotation.y-=.0005}gRay.setFromCamera(gMouse,gCam);const its=gRay.intersectObjects(gMeshes);if(its.length>0){const o=its[0].object;if(gHov!==o){if(gHov){const p=gHov;gAnimate(p.scale,'x',1,.4);gAnimate(p.scale,'y',1,.4);gAnimate(p.scale,'z',1,.4);gAnimate(p.position,'x',gR*Math.cos(p.userData.angle),.4);gAnimate(p.position,'z',gR*Math.sin(p.userData.angle),.4)}gHov=o;const hr=gR+1;gAnimate(o.scale,'x',1.2,.4);gAnimate(o.scale,'y',1.2,.4);gAnimate(o.scale,'z',1.2,.4);gAnimate(o.position,'x',hr*Math.cos(o.userData.angle),.4);gAnimate(o.position,'z',hr*Math.sin(o.userData.angle),.4);const pi=document.getElementById('gyro-preview-img');pi.style.opacity='0';setTimeout(()=>{pi.src=o.userData.src;document.getElementById('gyro-preview-label').textContent='Image '+(o.userData.index+1)+' / '+imagePaths.length;pi.style.opacity='1'},200)}}else if(gHov){const p=gHov;gAnimate(p.scale,'x',1,.4);gAnimate(p.scale,'y',1,.4);gAnimate(p.scale,'z',1,.4);gAnimate(p.position,'x',gR*Math.cos(p.userData.angle),.4);gAnimate(p.position,'z',gR*Math.sin(p.userData.angle),.4);gHov=null}gRend.render(gScene,gCam);gRAF=requestAnimationFrame(gLoop)}
window.openGyro=function(){if(imagePaths.length===0)return;document.getElementById('gyro').classList.add('open');initGyro();addEventListener('mousemove',gOnMM);addEventListener('mousedown',gOnMD);addEventListener('click',gOnCk);addEventListener('wheel',gOnWh,{passive:true});addEventListener('resize',gOnRs);gLoop()};
window.closeGyro=function(){document.getElementById('gyro').classList.remove('open');removeEventListener('mousemove',gOnMM);removeEventListener('mousedown',gOnMD);removeEventListener('click',gOnCk);removeEventListener('wheel',gOnWh);removeEventListener('resize',gOnRs);gLBOpen=false;document.getElementById('gyro-lightbox').classList.remove('open');if(gRAF){cancelAnimationFrame(gRAF);gRAF=null}if(gRend){const c=document.getElementById('gyro-canvas');if(c.contains(gRend.domElement))c.removeChild(gRend.domElement);gMeshes.forEach(m=>{if(m.material)m.material.dispose()});gTexs.forEach(t=>t.dispose());if(gCtrl)gCtrl.dispose();gRend.dispose();gRend=null}};
</script>
